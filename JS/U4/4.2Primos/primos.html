    <script>
        // creo funcion primo y despues la repito hasta el 1000
         function primo(num) {
            cont =0;
            for (let i=1; i<=num; i++) {
                if (num%i==0) {
                    cont++;
                }
            }//el uno no es primo
            if (cont==2) {//si tiene dos divisores, es primo
                document.write(num + "<br>");
            }//podria poner todos los numeros sin filtrar y poner cada uno si es primo o no, pero eligo solo mostrar los primos
        }

        for (let i=1; i<=1000; i++) {
            primo(i);
        }
