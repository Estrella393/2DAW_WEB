<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dar de alta · Panel de Olmo &amp; Sal</title>

  <link rel="stylesheet" href="css/styles.css">
  <!-- defer: los scripts se ejecutan en orden cuando el HTML ya está cargado -->
  <script src="js/usuarios.js" defer></script>  <!-- lógica: lo escriben los alumnos -->
  <script src="js/pagina.js" defer></script>     <!-- conexión con la página: se da hecho -->
</head>
<body>
  <header class="cabecera">
    <div class="contenedor cabecera__fila">
      <a class="logo" href="index.html">Olmo &amp; Sal <span class="logo__panel">Panel</span></a>

      <nav class="menu" aria-label="Principal">
        <ul class="menu__lista">
          <li><a class="menu__enlace" href="index.html">Usuarios</a></li>
          <li><a class="menu__enlace" href="alta.html" aria-current="page">Dar de alta</a></li>
          <li><a class="menu__enlace" href="baja.html">Dar de baja</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="contenedor pagina pagina--estrecha">
    <p class="antetitulo">Gestión</p>
    <h1>Dar de alta un usuario</h1>
    <p class="pagina__intro">Los campos marcados con <span aria-hidden="true">*</span> son obligatorios.</p>

    <!-- El script escribe aquí el resultado; role="status" hace que se anuncie -->
    <div role="status" id="estado"></div>

    <form class="formulario" id="form-alta" action="#" method="post">
      <fieldset class="grupo">
        <legend>Datos personales</legend>

        <div class="campo">
          <label for="nombre">Nombre <span class="obligatorio" aria-hidden="true">*</span></label>
          <input id="nombre" name="nombre" type="text" autocomplete="given-name" required>
        </div>

        <div class="campo">
          <label for="apellidos">Apellidos <span class="obligatorio" aria-hidden="true">*</span></label>
          <input id="apellidos" name="apellidos" type="text" autocomplete="family-name" required>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico <span class="obligatorio" aria-hidden="true">*</span></label>
          <input id="correo" name="correo" type="email" placeholder="nombre@correo.com" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" placeholder="600 000 000" autocomplete="tel"
                 pattern="[0-9 ]{9,12}" aria-describedby="ayuda-telefono">
          <p class="campo__ayuda" id="ayuda-telefono">Opcional. 9 cifras; puedes separarlas con espacios.</p>
        </div>
      </fieldset>

      <fieldset class="grupo">
        <legend>Tipo de usuario</legend>
        <div class="opciones">
          <label class="opcion">
            <input type="radio" name="tipo" value="Cliente" checked>
            Cliente
          </label>
          <label class="opcion">
            <input type="radio" name="tipo" value="Personal">
            Personal del restaurante
          </label>
        </div>
      </fieldset>

      <label class="opcion">
        <input type="checkbox" name="privacidad" required>
        <span>He leído y acepto la política de privacidad <span class="obligatorio" aria-hidden="true">*</span></span>
      </label>

      <div class="formulario__acciones">
        <button class="boton" type="submit">Dar de alta</button>
        <a class="boton boton--secundario" href="index.html">Cancelar</a>
      </div>
    </form>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p><small>© 2026 Olmo &amp; Sal · Panel de gestión · Proyecto de clase</small></p>
    </div>
  </footer>
</body>
</html>
