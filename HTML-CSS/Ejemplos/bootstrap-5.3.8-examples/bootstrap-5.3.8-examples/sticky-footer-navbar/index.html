  <style>
    .nav-scroller {
      position: relative;
      z-index: 2;
      height: 2.75rem;
      overflow-y: hidden;
    }

    .nav-scroller .nav {
      display: flex;
      flex-wrap: nowrap;
      padding-bottom: 1rem;
      margin-top: -1px;
      overflow-x: auto;
      text-align: center;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      ;

    }

    .navbar-brand,
    .navbar .nav-link,
    .navbar .nav-link.active {/*para que pille tambien home*/
      color: white;
      font-size: 18px;
      text-decoration: underline;
      text-underline-offset: 7px;
      text-decoration-thickness: 2px;
    }

    .navbar {
      background-color: #BEE0AC;
      /* o el color que quieras, por ejemplo blanco #fff */
    }


    .footer {
      background-color: #BEE0AC;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .izq {
      max-width: 30%;
      text-align: left;
    }

    .iconos {
      display: flex;
      gap: 14px;
      margin-left: auto;
    }

    .iconos img {
      width: 27px;
      height: 27px;
    }
  </style>
</head>

<body class="d-flex flex-column h-100">


  <header>
    <!-- Fixed navbar -->
    <nav class="navbar navbar-expand-md  fixed-top ">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Estrella Mena</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
          aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
          <ul class="navbar-nav me-auto mb-2 mb-md-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">Prácticas</a></li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Contacto</a>
            </li>
          </ul>

        </div>
      </div>
    </nav>
  </header>


  <footer class="footer mt-auto py-3 ">

    
      <div class=izq>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">
            Buscar
          </button>
        </form>
        <span class="text-body-secondary">Copyright © 2021 Luxe. All rights reserved</span>
        <div class="iconos">
          <img src="../sticky-footer-navbar/gmail-old-svgrepo-com.svg">
          <img src="../sticky-footer-navbar/whatsapp-svgrepo-com.svg">
          <img src="../sticky-footer-navbar/messenger-color-svgrepo-com.svg">
        </div>
      </div>
   


  </footer>
